// Aleph One app module. See docs/ANDROID_BUILD.md
plugins {
    id 'com.android.application'
}

// Release signing (for Meta Horizon Store / release-channel uploads). Credentials live in the
// gitignored android/keystore.properties (copy keystore.properties.template and fill it in, and
// generate the keystore — see that file). When the properties file is absent, release builds are
// simply left unsigned instead of failing, so debug workflows and fresh checkouts still build.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'org.alephone'
    compileSdk 35                          // gradle auto-downloads android-35 if missing
    ndkVersion '30.0.14904198'             // matches the installed NDK

    defaultConfig {
        applicationId 'org.alephone'
        minSdk 29                // Quest 2/3 (Android 10 / 12L)
        targetSdk 34                // Meta Horizon Store caps targetSdkVersion at 34 (compileSdk stays 35)
        versionCode 7
        versionName '0.7'

        // app_name is provided per-flavor via resValue (below), so every variant has a name.
        // (It used to live in res/values/strings.xml; moved here to avoid a duplicate-resource
        //  clash with the flavor resValues.)

        ndk {
            abiFilters 'arm64-v8a'   // Quest is arm64 only
        }

        externalNativeBuild {
            cmake {
                def vcpkgRoot = project.properties['VCPKG_ROOT'] ?: 'C:/Projects/vcpkg'
                arguments = [
                    // Consume the same deps as the desktop build, but for android.
                    "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                    "-DVCPKG_TARGET_TRIPLET=arm64-android",
                    "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                    // Reuse the prebuilt deps in android/jni/vcpkg_installed; don't reinstall at configure.
                    "-DVCPKG_INSTALLED_DIR=${projectDir}/../jni/vcpkg_installed",
                    "-DVCPKG_MANIFEST_INSTALL=OFF",
                    "-DANDROID_STL=c++_shared",
                    "-DA1_SMOKE_TEST=OFF",   // build the real engine, not the smoke app
                ]
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../jni/CMakeLists.txt'
            // Omit a version pin so AGP uses its bundled CMake (3.22.1, auto-fetched);
            // avoids fighting the very new CMake 4.1.2 you have installed.
        }
    }

    // ── Product flavors ───────────────────────────────────────────────────────
    // One engine, multiple shipped apps. `dev` is the generic multi-scenario build
    // used by deploy.ps1 (unchanged behavior: applicationId org.alephone, no bundled
    // data — you push a scenario over adb). The three game flavors are separately
    // branded, store-installable apps that BUNDLE their own base data + scenario
    // (assembled at build time below) so they run with nothing pushed over adb.
    flavorDimensions += 'product'
    productFlavors {
        dev {
            dimension 'product'
            applicationId 'org.alephone'
            resValue 'string', 'app_name', 'Aleph One'
        }
        marathon {
            dimension 'product'
            applicationId 'org.alephone.marathon'
            resValue 'string', 'app_name', 'Marathon'
        }
        marathon2 {
            dimension 'product'
            applicationId 'org.alephone.marathon2'
            resValue 'string', 'app_name', 'Marathon 2'
        }
        infinity {
            dimension 'product'
            applicationId 'org.alephone.infinity'
            resValue 'string', 'app_name', 'Marathon Infinity'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with the release key when configured; otherwise leave unsigned.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Consume the OpenXR loader AAR's native module (loader .so + headers) via Prefab.
    buildFeatures {
        prefab true
    }
}

dependencies {
    // SDL2 provides SDLActivity + the native libSDL2.so.
    // Easiest: depend on the official SDL Android aar once pinned, e.g.
    //   implementation 'org.libsdl:SDL2:2.30.+'
    // For now we vendor SDLActivity.java and build SDL2 via vcpkg/CMake.
    // TODO: pin SDL2 delivery (aar vs source) once the first build runs.

    // Official Khronos OpenXR loader for Android (current; supports the Horizon OS runtime broker).
    // Replaces the stale bundled libopenxr_loader.so. Provides the loader .so + headers via Prefab.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.60'
}

// ── Bundle base data + scenario into each game flavor's assets (build time) ──────
// The branded apps ship their data INSIDE the APK so they run with nothing pushed
// over adb. We assemble it from the repo's ./data at build time (instead of checking
// ~50 MB of duplicated data into src/<flavor>/assets) into a generated assets dir.
// At runtime AlephOneActivity extracts assets/game/** on first launch and points the
// engine at it via ALEPHONE_DEFAULT_DATA (see AlephOneActivity.java). The `dev` flavor
// gets NO bundled data, so it behaves exactly as before (adb-pushed external data).
def repoDataDir = new File(rootDir.parentFile, 'data')   // android/ is under the repo root
def scenarioForFlavor = [
        marathon : 'Marathon',
        marathon2: 'Marathon 2',
        infinity : 'Marathon Infinity',
]

scenarioForFlavor.each { flavorName, scenarioName ->
    def genDir = layout.buildDirectory.dir("generated-assets/${flavorName}")

    def bundleTask = tasks.register("bundle${flavorName.capitalize()}Data", Copy) {
        // ALWAYS re-run and overwrite. The scenario data is a git submodule whose content can change
        // without Gradle's up-to-date check reliably noticing -- which once SILENTLY packaged a stale
        // (wrong) assault-rifle asset into a store APK. Forcing the copy every build (~1s) guarantees
        // updated files land in the APK. Only the 3 branded release flavors use this; the dev/deploy.ps1
        // loop has no bundled data and is untouched. (NOTE: a plain Copy overwrites changed files but
        // does NOT prune a source file that was DELETED/renamed -- do a clean build if you rename assets.)
        outputs.upToDateWhen { false }
        into genDir.map { it.dir('game') }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE   // later 'from' wins (defaults overlay last)
        // 1. Base Aleph One data (MML, fonts, themes, icons, alephone.xml). Skip the
        //    Scenarios tree and non-runtime files, mirroring deploy.ps1 -Base's filter.
        from(repoDataDir) {
            exclude 'Scenarios'
            exclude '**/*.txt', '**/*.svg', '**/*.am', 'README'
        }
        // 2. The scenario folder's contents, verbatim (Map.*/Shapes.*/Sounds.*/Images.*,
        //    Plugins/, Scripts/, Music, Physics Models/, Demos, ...). Same as deploy.ps1's
        //    "copy the folder as-is" rule.
        from(new File(repoDataDir, "Scenarios/${scenarioName}")) {
            exclude '.git', '.gitignore', 'Readme.md', 'README.txt'
        }
        doFirst {
            if (!new File(repoDataDir, "Scenarios/${scenarioName}").isDirectory())
                throw new GradleException("Scenario data not found: data/Scenarios/${scenarioName}")
        }
    }

    // Register the generated dir as this flavor's assets root (so game/ -> assets/game/).
    // Wrapping it in files(...).builtBy(bundleTask) attaches the task as the producer of this
    // directory, so EVERY consumer (mergeAssets, lintVital, bundle/AAB) auto-depends on it.
    android.sourceSets.getByName(flavorName).assets.srcDir(files(genDir).builtBy(bundleTask))

    // Belt-and-suspenders on top of builtBy: explicitly make this flavor's asset-merge tasks depend
    // on the bundle, so a fresh/clean build can't package EMPTY assets by running mergeAssets before
    // the copy (that produced dataless 17MB APKs once). Named-match catches the AGP tasks made later.
    // The builtBy wiring above only made consumers depend on the bundle while the bundle was being
    // SKIPPED (up-to-date); once it always runs, Gradle strictly enforces that every task reading the
    // generated assets declares the dependency -- including the lintVital tasks. List them explicitly.
    def cap = flavorName.capitalize()
    tasks.matching {
        it.name == "merge${cap}ReleaseAssets" || it.name == "merge${cap}DebugAssets" ||
        it.name == "lintVitalAnalyze${cap}Release" || it.name == "generate${cap}ReleaseLintVitalReportModel"
    }.configureEach { dependsOn bundleTask }
}
